#布局
preset_keyboards:
  default:
    author: "M_Stone"
    name: "主键盘"
    ascii_mode: 0                         #键盘默认中英文状态：0中文；1英文字母
    lock: true                            #在不同app切换时是否锁定键盘：true锁定；false不锁定
    label_transform: uppercase            #中文状态字母大小写：uppercase大写；none小写
    height: *DAKH                         #默认键高
    width: *DAKW                          #默认键宽
    round_corner: *DKRC                   #按键圆角半径大小
    horizontal_gap: *DKCS                 #列距
    vertical_gap: *DKRS                   #行距
    key_text_offset_x: *TALX              #字母横向
    key_text_offset_y: *TALY              #字母纵向
    key_symbol_offset_x: *TUSX            #符号（上标）横向
    key_symbol_offset_y: *TUSY            #符号（上标）纵向
    key_hint_offset_x: *THIX              #下标横向
    key_hint_offset_y: *THIY              #下标纵向
    key_press_offset_x: *TKPX             #按下后字符横向偏移
    key_press_offset_y: *TKPY             #按下后字符纵向偏移
    keyboard_back_color: Dback            #键盘背景
    keys: 
      - {height: *SICK, width: 100, click: henglan, key_back_color: HGLJ, hilited_key_back_color: HGLJ}       #候选与按键间隔空白行
      #行 Q-P
      - {click: q, long_click: "1", swipe_up: "?", swipe_down: "symbol_uuxm", swipe_left: "|", swipe_right: "|", hint: "|", key_back_color: QQQ, hilited_key_back_color: HKBC, key_text_color: AKTC, key_border_color: AKBC, key_border: *DKBR}
      - {click: w, long_click: "2", swipe_up: ",", swipe_down: "symbol_at", swipe_left: "@", swipe_right: "@", hint: "@", key_back_color: WWW, hilited_key_back_color: HKBC, key_text_color: AKTC, key_border_color: AKBC, key_border: *DKBR}
      - {click: e, long_click: "3", swipe_up: ".", swipe_down: "symbol_jkhc", swipe_left: "#", swipe_right: "#", hint: "#", key_back_color: EEE, hilited_key_back_color: HKBC, key_text_color: AKTC, key_border_color: AKBC, key_border: *DKBR}
      - {click: r, long_click: "4", swipe_up: "|", swipe_down: "symbol_mwyr", swipe_left: "$", swipe_right: "$", hint: "$", key_back_color: RRR, hilited_key_back_color: HKBC, key_text_color: AKTC, key_border_color: AKBC, key_border: *DKBR}
      - {click: t, long_click: "5", swipe_up: "{", swipe_down: "%", swipe_left: "%", swipe_right: "%", hint: "%", key_back_color: TTT, hilited_key_back_color: HKBC, key_text_color: AKTC, key_border_color: AKBC, key_border: *DKBR}
      - {click: y, long_click: "6", swipe_up: "}", swipe_down: "symbol_crhc", swipe_left: "^", swipe_right: "^", hint: "^", key_back_color: YYY, hilited_key_back_color: HKBC, key_text_color: AKTC, key_border_color: AKBC, key_border: *DKBR}
      - {click: u, long_click: "7", swipe_up: "[", swipe_down: "symbol_hehc", swipe_left: "&", swipe_right: "&", hint: "&", key_back_color: UUU, hilited_key_back_color: HKBC, key_text_color: AKTC, key_border_color: AKBC, key_border: *DKBR}
      - {click: i, long_click: "8", swipe_up: "]", swipe_down: "symbol_xkhc", swipe_left: "*", swipe_right: "*", hint: "*", key_back_color: III, hilited_key_back_color: HKBC, key_text_color: AKTC, key_border_color: AKBC, key_border: *DKBR}
      - {click: o, long_click: "9", swipe_up: "<", swipe_down: "symbol_xkhz", swipe_left: "(", swipe_right: "(", hint: "(", key_back_color: OOO, hilited_key_back_color: HKBC, key_text_color: AKTC, key_border_color: AKBC, key_border: *DKBR}
      - {click: p, long_click: "0", swipe_up: ">", swipe_down: "symbol_xkhy", swipe_left: ")", swipe_right: ")", hint: ")", key_back_color: PPP, hilited_key_back_color: HKBC, key_text_color: AKTC, key_border_color: AKBC, key_border: *DKBR}
      #行 A-L
      - {width: 5, click: Notg, key_text_size: 16, key_symbol_color: 0x00, key_back_color: ALEF, hilited_key_back_color: ALEH, key_text_color: DBKT, key_text_offset_x: 0, key_text_offset_y: -2}#, click: a, key_back_color: 0x00, hilited_key_back_color: 0x00, key_text_color: 0x00, key_border_color: 0x00}
