#适合同文无障碍版【中文输入法】主题
config_version: "2022-05-16 2.4"
name: 𝐒𝐢𝐥𝐯𝐞𝐫 𝐁𝐮𝐥𝐥𝐞𝐭 𝟐𝟎𝟐𝟐 𝐄𝐯𝐨𝐥𝐮𝐭𝐢𝐨𝐧       #主题名称
author: 酷安@M_Stone           #作者
#使用说明，https://www.coolapk1s.com/feed/30971017

height:
#按键大小间距位移命名规则，取前几字母，布局名（1）+按键（2）+长度（1）
#例如 &ZZJW 主键盘主按键宽；&ZJCS 主键盘列距
#间距 Spacing
#宽度 Width
#高度 Height
#圆角 Round Corner
#位移：
#横向 X-offset
#纵向 Y-offset
#行   Rows
#列   Columns
#行距 ~~RS
#列距 ~~CS

  #主键盘 Default 空格+数字+回车+标点×2=100，主键盘长按与下划输入显示的英文符号，部分标点上划输入对应的中文标点。
  A: &DAKH 54         #默认键高 Default Alphabet Key Height
  B: &DAKW 10         #默认键宽 Default Alphabet Key Width
  C: &DSHW 12.5       #上档键宽 Default Shift Width
  D: &DDEW 17.5       #删除键宽 Default Delete Width
  E: &DNUW 15         #数字键宽 Default Number Width
  F: &DSYW 12.5       #标点键宽 Default Symbol Width
  G: &DENW 15         #回车键宽 Default Enter Width
  H: &DSPW 32.5       #空格键宽 Default Space Width
  I: &DKRS 5          #按键行距 Default Key Rows Spacing
  J: &DKCS 3          #按键列距 Default Key Columns Spacing
  K: &DKRC 10         #按键圆角 Default Key Round Corner
  L: &NUMH 42.2       #数字或符号行高 Numbers Height
  M: &NUMW 8.52       #数字或键宽 Numbers Width
  
  #字符坐标偏移 Text Coordinate 偏移设置.5以外其他小数值可能会导致严重崩溃，慎写！！！
  a: &TUSY 0          #上标纵向 Text Up Symbol Y-offset
  b: &TUSX 2.5        #上标横向 Text Up Symbol X-offset
  c: &TALY -3         #字母纵向 Text Alphabet Y-offset
  d: &TALX -1.5       #字母横向 Text Alphabet X-offset
  e: &THIY 0          #下标纵向 Text Hint Y-offset
  f: &THIX 2.5        #下标横向 Text Hint X-offset
  g: &TKPY -10        #按下纵向 Text Key Press Y-offset
  h: &TKPX 0          #按下横向 Text Key Press X-offset
  i: &TSPY -9.5       #空格纵向 Text Space Y-offset
  k: &TSPX -22        #空格横向 Text Space X-offset
  l: &FKTY -10        #功能键文本纵向 Function Key Text Y-offset
  m: &FKTX -5         #功能键文本横向 Function Key Text X-offset
  n: &FKSY 0          #功能键符号纵向 Function Key Symbol Y-offset
  o: &FKSX 20         #功能键符号横向 Function Key Symbol X-offset
  p: &DDTY -10        #删除键文本纵向 Default Delete Text Y-offset
  q: &SHTY -10        #Shift文本纵向 SHift Text Y-offset
  r: &SHTX -5         #Shift文本横向 SHift Text X-offset
  s: &SHSY 0          #Shift符号纵向 SHift Symbol Y-offset
  t: &SHSX 13         #Shift符号横向 SHift Symbol X-offset
  
  #数字键盘 Number
  1: &NNUH 54         #默认键高 Number Number Height
  2: &NNUW 20         #数字键宽 Number Number Width
  3: &NFKW 20         #功能键宽 Number Function Key Width
  4: &NKRS 5          #按键行距 Number Key Rows Spacing
  5: &NKCS 3          #按键列距 Number Key Columns Spacing
  6: &NKRC 10         #按键圆角 Number Key Round Corner

  #数字键盘字符偏移
  ①: &NUSY 1          #上标纵向 Number Up Symbol Y-offset
  ②: &NUSX 6          #上标横向 Number Up Symbol X-offset
  ③: &NTXY -3         #文本纵向 Number Text Y-offset
  ④: &NTXX -3         #文本横向 Number Text X-offset
  ⑤: &NHIY 0          #下标纵向 Number Hint Y-offset
  ⑥: &NHIX 6          #下标横向 Number Hint X-offset
  ⑦: &NKPX 0          #按下横向 Number Key Press X-offset
  ⑧: &NKPY -10        #按下纵向 Number Key Press Y-offset
  ⑨: &NSTX -5         #符号文本横向 Number Symbol Text X-offset
  ⑩: &NSTY -10        #符号文本纵向 Number Symbol Text Y-offset
  ⑪: &NSSX 6          #符号上标横向 Number Symbol Symbol X-offset
  ⑫: &NSSY 3          #符号上标纵向 Number Symbol Symbol Y-offset
  ⑬: &NSHX 6          #符号下标横向 Number Symbol Hint X-offset
  ⑮: &NSHY 0          #符号下标纵向 Number Symbol Hint Y-offset
  
  #符号键盘 Symbol
  ❶: &SSKH 54         #符号键高 Symbol Symbol Key Height
  ❷: &SSKW 10         #符号键宽 Symbol Symbol Key Width
  ❸: &SFKW 20         #功能键宽 Symbol Function Key Width
  ❹: &SKRS 5          #按键行距 Symbol Key Rows Spacing
  ❺: &SKCS 3          #按键列距 Symbol Key Columns Spacing
  ❻: &SKRC 10         #按键圆角 Symbol Key Round Corner
  ❼: &SKTX 0          #文本横向 Symbol Key Text X-offset
  ❽: &SKTY 0          #文本纵向 Symbol Key Text Y-offset
  ❾: &SKPX 0          #按下横向 Symbol Key Press X-offset
  ❿: &SKPY -10        #按下纵向 Symbol Key Press Y-offset
  ⓫: &SFKX -10        #功能文本偏移横向 Symbol Function Key X-offset
  ⓬: &SFKY -10        #功能文本偏移纵向 Symbol Function Key Y-offset
  ⓭: &SHIX 21         #功能下标偏移横向 Symbol Function Hint Y-offset
  ⓮: &SHIY 0          #功能下标偏移纵向 Symbol Function Hint Y-offset
  
  #选单布局 Menu
  Ⓐ: &MKEH 54         #按键键高 Menu Key Height
  Ⓑ: &MKEW 20         #按键键宽 Menu Key Width
  Ⓒ: &MTEY -2         #文本纵向 Menu Text Y-offset
  Ⓓ: &MTEX 0          #文本横向 Menu Text X-offset
  Ⓔ: &MHIY 0.5        #下标纵向 Menu Hint Y-offset
  Ⓕ: &MHIX 0          #下标横向 Menu Hint X-offset
  
  #候选区 Candidate
  ⓐ: &CANH 28         #候选区高 Candidate Height
  ⓑ: &COMH 18         #提示区高 Comment Height
  ⓒ: &SICK 3.0        #候选与按键行间距 Spacing In Candidate and Key
  
  #其他
  ⒜: &DBKH 48         #底部栏高 Default Bottom Key Height 有手势小横条时可设置36
  ⒝: &DBKX 25         #底栏键宽 Default Bottom Key Width
  ⒞: &LAKH 40         #横屏键高 Land Alphabet Key Height
  ⒟: &DKBR 0.6        #按键边框 Default Key Border

#底栏开关，使用正则表达式查找替换
#状态开→关：查找“(#行 增高行.*\n)(.*\n)(.*\n)(.*\n)(.*\n)(.*结束)”替换为“$1#$2#$3#$4#$5$6”
#状态关→开：查找“(#行 增高行.*\n)#(.*\n)#(.*\n)#(.*\n)#(.*\n)(.*结束)”替换为“$1$2$3$4$5$6”
  
style:
  keyboards: [.default, number, numberx, letter, menu, edit, symbol_cn, symbol_en, default_land, Sapphire, Sapphire_land, easy_cn, numberx_land, symbol_en1] #声明
  auto_caps: false                          #自动句首大写:true|false|ascii
  candidate_use_cursor: true                #高亮候选项
  comment_on_top: true                      #候选窗和状态栏提示在上方true或右侧false
  horizontal: true                          #水平模式
  candidate_hide_button: "️️﹀ "             #候选栏隐藏键盘按钮﹀ 
  candidate_left_button: "☜"             #候选栏上一页
  candidate_right_button: "☞"            #候选栏下一页
  proximity_correction: true                #无click时是否沿用相邻键功能，位于左右两端的即使否也会沿用
  reset_ascii_mode: false                   #不同进程中显示键盘时重置为中文状态（true:重置为中文；false:记忆中英状态）
  latin_locale: en_US                       #西文语言
  locale: zh_CN                             #预设语言
  speech_opencc_config: none                #语音输入简繁转换
  #字体 Fonts
  hanb_font: ExtB-G.ttf                     #扩充字体，补充候选字体
  candidate_font: IBM中粗黑.ttf             #候选区字体，某圆体修正-R.ttf
  comment_font: ExtB-G.ttf                  #提示区（候选注释）字体
  key_font: Gineso.ttf                      #按键字体 #筑紫黑体粗.ttf
  symbol_font: ziti.ttf                     #符号字体（上标和下标）
  preview_font: ziti.ttf                    #按键提示字体（按键气泡）
  latin_font: latin.ttf                     #西文字体
  text_font: IBM中粗黑.ttf                  #悬浮窗编码字体
  label_font: ziti.ttf                      #悬浮窗候选序号字体
  #字体大小 Fonts Size
  candidate_text_size: 22                   #候选字号
  comment_text_size: 14                     #候选窗和状态栏提示字号
  key_long_text_size: 20                    #两字以上时键字号
  key_text_size: 20                         #键字号
  symbol_text_size: 12                      #符号字号，上、下标字号
  preview_text_size: 24                     #按键提示字号
  label_text_size: 18                       #悬浮窗序号字号
  text_size: 20                             #悬浮窗编码字号
  #尺寸参数
  candidate_padding: 4                      #候选项内边距
  candidate_spacing: 4                      #候选间距
  candidate_view_height: *CANH              #候选区高度
  comment_height: *COMH                     #候选窗和状态栏提示区高度
  preview_height: 20                        #按键提示高度（按键弹出气泡）
  preview_offset: -8                        #按键提示纵向偏移
  vertical_correction: -5                   #按键接触面纵向偏移，负数下移
  key_border: *DKBR                         #按键边框宽
  shadow_radius: 1.0                        #按键阴影半径
  #部分默认的键盘参数
  key_width: 10.0                           #键宽，占银幕宽的百分比
  key_height: *DAKH                         #键盘键高
  vertical_gap: *DKRS                       #键盘行距
  horizontal_gap: *DKCS                     #键盘列距
  round_corner: *DKRC                       #键盘按键圆角半径
  #悬浮窗设置项
  layout:
    position: fixed                         #位置：left|right|left_up|right_up|fixed|bottom_left|bottom_right|top_left|top_right
    min_length: 0                           #候选窗口最小词长
    max_length: 20                          #超过字数则换行
    sticky_lines: 0                         #固顶行数
    max_entries: 3                          #候选窗口最大词条数
    all_phrases: false                      #所有满足条件的词语都显示在窗口
    border: 0                               #候选窗口边框宽度
    max_width: 1080                         #最大宽度，超过则自动换行
    min_width: 10                           #最小宽度
    max_height: 100                         #最大高度
    min_height: 10                          #最小高度
    margin_x: 10                            #文字与悬浮窗外边缘水平边距
    margin_y: 3                             #文字与悬浮窗外边缘竖直边距
    line_spacing: 1                         #候选词的行间距(px)
    line_spacing_multiplier: 1              #候选词的行间距(倍数)
    spacing: 0                              #悬浮窗偏移量，以候选栏上边缘为基准，向上为正
    round_corner: 0                         #候选窗口圆角
    alpha: 255                              #透明度(0-255)
    elevation: 0                            #阴影(>=Android5.0)
    background: candidate_text_color        #背景颜色或者backgrounds目录图片文件，此项无效时后面配色text_back_color则生效
    movable: false                          #是否可移动窗口，或仅移动一次 true|false|once
  window:                                   #悬浮窗口组件
    - {start: "", composition: "%s", end: "", letter_spacing: 0} #编码行，letter_spacing需要Android5.0。TODO: 不为0时，会导致不换行的问题
    - {start: "\n", label: "%s.", candidate: "%s", comment: "%s", end: "", sep: "  "} #候选行，label: "%s.", 序号;start: "\n", 换行

fallback_colors:                            #后备颜色，配色方案中未定义的颜色，自动从这里推导。
  #悬浮窗
  border_color: 0xffe7e8ec                  #悬浮窗边框
  label_color: 0xff616161                   #悬浮窗其他候选序号
  text_back_color: 0xffe7e8ec               #悬浮窗背景
  #composition_back_color:                  #悬浮窗图片背景（无障碍，png，gif）
  text_color: 0xffff2200                    #悬浮窗编码分隔脚标∧
  hilited_text_color: 0xffff2200            #悬浮窗编码
  hilited_back_color: 0x00                  #悬浮窗编码背景
  hilited_label_color: 0xffff2200           #悬浮窗高亮候选序号
  hilited_candidate_back_color: 0x00        #悬浮窗候选首选背景
  #键盘，普通键
  keyboard_back_color: 0xffe7e8ec           #布局默认背景
  key_border_color: 0xffe2e2e2              #按键边框颜色
  key_back_color: 0xffffffff                #按键背景
  key_text_color: 0xffa1a3a6                #按键字母颜色
  key_symbol_color: 0x558e8e8e              #按键上下符号颜色
  hilited_key_back_color: 0xff4bc1e1        #高亮按键背景
  hilited_key_text_color: 0xffffffff        #高亮按键字母
  hilited_key_symbol_color: 0xffffffff      #高亮按键符号
  #shift 键锁定，shift 键不可设置key_back_color，否则无效
  on_key_back_color: 0xff4bc1e1             #按键背景
  on_key_text_color: 0xffff2200             #按键文本
  hilited_on_key_back_color: 0xffff2200     #高亮按键背景
  hilited_on_key_text_color: 0xffffffff     #高亮按键文本
  #shift 键常态及功能键
  off_key_back_color: 0xffaab1bb            #按键背景
  off_key_text_color: 0xfffafafa            #按键文本
  hilited_off_key_back_color: 0xffff2200    #高亮按键背景
  hilited_off_key_text_color: 0xffffffff    #高亮按键文本
  #按键弹出气泡（按键提示）
  preview_back_color: 0xbbd1d4d9            #气泡背景
  preview_text_color: 0xffff4e4e            #文本颜色
  shadow_color: 0xffe2e2e2                  #文本阴影颜色（阴影半径 shadow_radius）
  #候选栏（状态栏）
  back_color: 0xffffffff                    #状态栏背景
  candidate_separator_color: 0x00           #状态栏分割背景
  candidate_text_color: 0xffa1a3a6          #状态栏文本颜色，候选内容次选颜色
  comment_text_color: 0xffe2e2e2            #提示区文本颜色（注释）
  hilited_candidate_text_color: 0xffff2200  #首选文本颜色
  hilited_comment_text_color: 0xff4bc1e1    #首选提示颜色
