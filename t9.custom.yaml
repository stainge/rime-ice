patch: # 朙月拼音、袖珍簡化字拼音、地球拼音九宮格
  "preset_keyboards/eng":
    ascii_mode: 1
    author: "osfans <waxaca@163.com>"
    height: 44
    keys:
      [
        { click: 1, long_click: "!" },
        { click: 2, long_click: "@" },
        { click: 3, long_click: "#" },
        { click: 4, long_click: "$" },
        { click: 5, long_click: "%" },
        { click: 6, long_click: "^" },
        { click: 7, long_click: "&" },
        { click: 8, long_click: "*" },
        { click: 9, long_click: "(" },
        { click: 0, long_click: ")" },
        { click: q, long_click: _ },
        { click: w, long_click: "-" },
        { click: e, long_click: "+" },
        { click: r, long_click: "=" },
        { click: t, long_click: "|" },
        { click: y, long_click: "\\" },
        { click: u, long_click: "[" },
        { click: i, long_click: "]" },
        { click: o, long_click: "{" },
        { click: p, long_click: "}" },
        { width: 5 },
        { click: a, long_click: select_all },
        { click: s, long_click: Home },
        { click: d, long_click: End },
        { click: f, long_click: Page_Up },
        { click: g, long_click: Page_Down },
        { click: h, long_click: Left },
        { click: j, long_click: Down },
        { click: k, long_click: ":" },
        { click: l, long_click: ";" },
        { width: 5 },
        { click: Shift_L, has_menu: "'", width: 15 },
        { click: z, long_click: "`" },
        { click: x, long_click: cut },
        { click: c, long_click: copy },
        { click: v, long_click: paste },
        { click: b, long_click: "~" },
        { click: n, long_click: '"' },
        { click: m, long_click: MoeDict },
        { click: BackSpace, width: 15 },
        { click: Keyboard_default, long_click: Menu, width: 15 },
        { click: Keyboard_symbols, long_click: Keyboard_number },
        { click: ",", long_click: "<" },
        { click: space, width: 30 },
        { click: ., long_click: ">" },
        { click: "/", long_click: "?" },
        { click: Return, long_click: CommitComment, width: 15 },
      ]
    label_transform: uppercase
    name: "預設36鍵"
    width: 10

  "preset_keyboards/letter":
    ascii_mode: 0
    author: "osfans <waxaca@163.com>"
    height: 55
    key_hint_offset_x: 0
    key_hint_offset_y: 0
    key_press_offset_x: 2
    key_press_offset_y: 2
    key_symbol_offset_x: 0
    key_symbol_offset_y: 0
    key_text_offset_x: 0
    key_text_offset_y: 0
    keys:
      [
        { click: q, long_click: "!", swipe_up: 1 },
        { click: w, long_click: "@", swipe_up: 2 },
        { click: e, long_click: "#", swipe_up: 3 },
        { click: r, long_click: "$", swipe_up: 4 },
        { click: t, long_click: "%", swipe_up: 5 },
        { click: y, long_click: "^", swipe_up: 6 },
        { click: u, long_click: "&", swipe_up: 7 },
        { click: i, long_click: "*", swipe_up: 8 },
        { click: o, long_click: "(){Left}", swipe_up: 9 },
        { click: p, long_click: Hide, swipe_up: 0 },
        { width: 5 },
        {
          click: a,
          long_click: select_all,
          swipe_down: Down,
          swipe_left: Left,
          swipe_right: Right,
          swipe_up: Up,
        },
        {
          click: s,
          long_click: "~",
          swipe_down: Page_Down,
          swipe_left: Home,
          swipe_right: End,
          swipe_up: Page_Up,
        },
        { click: d, long_click: "-", swipe_down: _ },
        { click: f, long_click: "+", swipe_down: "=" },
        { click: g, long_click: "\\", swipe_down: "|" },
        { click: h, long_click: "[]{Left}", swipe_left: "[", swipe_right: "]" },
        { click: j, long_click: "{}{Left}", swipe_left: "{", swipe_right: "}" },
        { click: k, long_click: ":" },
        { click: l, long_click: ";" },
        { width: 5 },
        { click: Shift_L, send_bindings: false, width: 10 },
        { click: z, long_click: "?" },
        { click: x, long_click: cut },
        { click: c, long_click: copy },
        { click: v, long_click: paste },
        { click: b, long_click: "/" },
        { click: n, long_click: '"' },
        { click: m, long_click: "'" },
        { click: BackSpace, swipe_left: Escape, width: 20 },
        { click: Keyboard_default, long_click: Menu, width: 15 },
        { click: Keyboard_symbols, long_click: Keyboard_number },
        { click: ",", long_click: "<" },
        { click: space, width: 30 },
        { click: ., long_click: ">" },
        { click: Return, long_click: CommitComment, width: 25 },
      ]
    name: "預設26鍵"
    width: 10

  "preset_keyboards/t9":
    ascii_mode: 0
    author: "Uncle光 <467896722@qq.com>"
    name: t9
    height: 55
    key_hint_offset_x: 0
    key_hint_offset_y: 0
    key_press_offset_x: 2
    key_press_offset_y: 2
    key_symbol_offset_x: 0
    key_symbol_offset_y: 0
    key_text_offset_x: 0
    key_text_offset_y: 0
    width: 23
    keys:
      #第一行
      - {
          click: ",",
          long_click: "=",
          send_bindings: false,
          width: 15,
          swipe_up: Up,
          swipe_down: Down,
          swipe_left: Left,
          swipe_right: Right,
        }
      - {
          click: 1,
          label: "'",
          composing: "'",
          long_click: _Keyboard_phrase,
          swipe_up: Up,
          swipe_down: Down,
          swipe_left: Left,
          swipe_right: Right,
        }
      - {
          click: 2,
          label: abc,
          long_click: select_all,
          swipe_up: Up,
          swipe_down: Down,
          swipe_left: Left,
          swipe_right: Right,
        }
      - {
          click: 3,
          label: def,
          long_click: lua_script_cv,
          swipe_up: Up,
          swipe_down: Down,
          swipe_left: Left,
          swipe_right: Right,
        }
      - { click: BackSpace, width: 16 }
      #第二行
      - {
          click: ";",
          long_click: "-",
          send_bindings: false,
          width: 15,
          swipe_up: Up,
          swipe_down: Down,
          swipe_left: Left,
          swipe_right: Right,
        }
      - {
          click: 4,
          label: ghi,
          long_click: Home,
          swipe_up: Up,
          swipe_down: Down,
          swipe_left: Left,
          swipe_right: Right,
        }
      - {
          click: 5,
          label: jkl,
          long_click: BackToSentence,
          swipe_up: Up,
          swipe_down: Down,
          swipe_left: Left,
          swipe_right: Right,
        }
      - {
          click: 6,
          label: mno,
          long_click: End,
          swipe_up: Up,
          swipe_down: Down,
          swipe_left: Left,
          swipe_right: Right,
        }
      - {
          click: Keyboard_number,
          width: 16,
          swipe_up: Up,
          swipe_down: Down,
          swipe_left: Left,
          swipe_right: Right,
          long_click: "`",
        }
      #第三行
      - {
          click: "?",
          long_click: "/",
          send_bindings: false,
          width: 15,
          swipe_up: Up,
          swipe_down: Down,
          swipe_left: Left,
          swipe_right: Right,
        }
      - {
          click: 7,
          label: pqrs,
          long_click: copy,
          swipe_up: Up,
          swipe_down: Down,
          swipe_left: Left,
          swipe_right: Right,
        }
      - {
          click: 8,
          label: tuv,
          long_click: paste,
          swipe_up: Up,
          swipe_down: Down,
          swipe_left: Left,
          swipe_right: Right,
        }
      - {
          click: 9,
          label: wxyz,
          long_click: cut,
          swipe_up: Up,
          swipe_down: Down,
          swipe_left: Left,
          swipe_right: Right,
        }
      - {
          click: Keyboard_alpha,
          long_click: '"',
          width: 16,
          swipe_up: Up,
          swipe_down: Down,
          swipe_left: Left,
          swipe_right: Right,
        }
      #第四行
      - {
          click: Keyboard_symbols,
          long_click: Menu,
          width: 15,
          popup: [Menu, _Keyboard_clip, _Keyboard_phrase, _Keyboard_script],
        }
      - {
          click: ".",
          send_bindings: false,
          long_click: "(){Left}",
          swipe_left: "(",
          swipe_right: ")",
          swipe_up: Up,
          swipe_down: Down,
        }
      - {
          click: 0,
          send_bindings: false,
          long_click: "[]{Left}",
          swipe_left: "[",
          swipe_right: "]",
          swipe_up: Up,
          swipe_down: Down,
        }
      - {
          click: space,
          swipe_up: Up,
          swipe_down: Down,
          long_click: VOICE_ASSIST,
        }
      - {
          click: Return,
          width: 16,
          long_click: _Keyboard_edit,
          popup:
            [
              select_all,
              cut,
              copy,
              paste,
              _Keyboard_edit,
              DeleteCandidate,
              BackToSentence,
            ],
        }

  "preset_keys/Keyboard_eng":
    label: "英文"
    select: eng
    send: Eisu_toggle

  "preset_keys/Keyboard_letter":
    label: "反查"
    select: letter
    send: Eisu_toggle

  "preset_keys/Hang": { text: "{End}{Shift+Home}", label: "行選" }

  "style/keyboards":
    - .default
    - letter
    - eng
    - default
    - number
    - symbols
